name: parity

# Guard `tf-format --style minimal` against `tofu fmt`: minimal mode promises
# `terraform fmt` / `tofu fmt` parity, so a tofu-fmt-canonical fixture must be a
# no-op under tf-format. scripts/parity-check.sh proves it; run it over the
# committed fixtures (deterministic — no external clones). Real-repo sweeps live
# in the same script: `parity-check.sh <some-cloned-repo>`.
#
# Like CI's `Test`, the `tofu fmt parity` job ALWAYS runs (via the `changes`
# guard) and short-circuits to success when nothing that could affect parity
# changed — so it can be a required status check without the path-filter deadlock.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  changes:
    name: Detect parity-relevant changes
    runs-on: ubuntu-latest
    outputs:
      relevant: ${{ steps.filter.outputs.relevant }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
      - uses: dorny/paths-filter@fbd0ab8f3e69293af611ebaee6363fc25e6d187d # v4
        id: filter
        with:
          filters: |
            relevant:
              - 'src/**'
              - 'scripts/parity-check.sh'
              - 'tests/parity/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'flake.nix'
              - 'flake.lock'
              - 'rust-toolchain.toml'
              - '.github/workflows/parity.yml'

  parity:
    name: tofu fmt parity
    needs: changes
    runs-on: ubuntu-latest
    steps:
      - name: Skip (no parity-relevant changes)
        if: needs.changes.outputs.relevant != 'true'
        run: echo "Nothing affecting parity changed — parity is a no-op success."

      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        if: needs.changes.outputs.relevant == 'true'
      - uses: DeterminateSystems/nix-installer-action@a7ad9c4f0c65208097f4d34f3cfa1913b80cce5c # main
        if: needs.changes.outputs.relevant == 'true'
      - uses: DeterminateSystems/magic-nix-cache-action@76aaf8814cdb385b86597c32b8c51b66b69b0839 # main
        if: needs.changes.outputs.relevant == 'true'
      - name: tf-format minimal vs tofu fmt (fixtures)
        if: needs.changes.outputs.relevant == 'true'
        run: |
          nix develop --command bash -euo pipefail -c '
            cargo build --release
            TF_FORMAT=target/release/tf-format ./scripts/parity-check.sh tests/parity/fixtures
          '
