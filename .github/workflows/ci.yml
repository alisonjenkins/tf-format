name: CI

# Build, lint, format-check, test and dependency-review on every push to main
# and every PR.
#
# The `Test` job ALWAYS runs (via the `changes` guard below) so it can be a
# required status check without the path-filter deadlock: a job skipped with a
# top-level `if:` never reports its check, which blocks merges on PRs that don't
# touch buildable code (docs, workflow tweaks). Here the job runs unconditionally
# and short-circuits to success when no Rust/build inputs changed, so the check
# always reports.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    outputs:
      rust: ${{ steps.filter.outputs.rust }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4
        id: filter
        with:
          filters: |
            rust:
              - 'src/**'
              - 'tests/**'
              - 'benches/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'flake.nix'
              - 'flake.lock'
              - 'rust-toolchain.toml'
              - 'deny.toml'
              - '.github/workflows/ci.yml'

  test:
    name: Test
    needs: changes
    runs-on: ubuntu-latest
    steps:
      - name: Skip (no buildable changes)
        if: needs.changes.outputs.rust != 'true'
        run: echo "No Rust/build inputs changed — Test is a no-op success."

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        if: needs.changes.outputs.rust == 'true'

      - uses: DeterminateSystems/nix-installer-action@b67ad2f0e8376a0bc947db191e4484285b6f5b56 # main
        if: needs.changes.outputs.rust == 'true'

      - uses: DeterminateSystems/magic-nix-cache-action@2cdbb78a6eed25b3bc8b97f863549be5f6567e55 # main
        if: needs.changes.outputs.rust == 'true'

      - name: Build
        if: needs.changes.outputs.rust == 'true'
        run: nix build

      - name: Check formatting
        if: needs.changes.outputs.rust == 'true'
        run: nix develop --command cargo fmt --check

      - name: Clippy
        if: needs.changes.outputs.rust == 'true'
        run: nix develop --command cargo clippy -- -D warnings

      - name: Run tests
        if: needs.changes.outputs.rust == 'true'
        run: nix develop --command cargo test

      - name: cargo deny
        if: needs.changes.outputs.rust == 'true'
        run: nix develop --command cargo deny check

  dependency-review:
    name: Dependency Review
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
